<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bán Sách - Điểm Danh & Thu Tiền</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) CDN for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: #ffffff;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .touch-btn {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-slate-900 antialiased">

  <!-- ================= TOP STICKY BAR ================= -->
  <header class="sticky-header border-b border-slate-200 shadow-xs">
    <div class="max-w-xl mx-auto px-3 pt-2.5 pb-2">
      
      <!-- Top 2 Main Action Buttons (Enlarged) -->
      <div class="grid grid-cols-2 gap-2 mb-2">
        <!-- Price per book button -->
        <button onclick="openPriceModal()" class="touch-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-800 text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 shadow-2xs transition-all">
          <span>🏷️</span> <span id="price-display">Đặt giá sách</span>
        </button>

        <!-- Export Excel button -->
        <button onclick="exportToExcel()" class="touch-btn py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-black active:scale-[0.98] text-white text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 shadow-sm transition-all">
          <span>📥 Xuất Excel</span>
        </button>
      </div>

      <!-- 3 STATS CARDS: Tiền mặt | Chuyển khoản | Tổng tiền đã thu -->
      <div class="grid grid-cols-3 gap-1.5 mb-2">
        <!-- Tiền mặt -->
        <div class="bg-white p-2 rounded-lg border border-slate-200 text-center">
          <div class="text-[10px] font-medium text-slate-500">💵 Tiền mặt (<span id="count-cash">0</span>)</div>
          <div class="text-xs sm:text-sm font-bold text-slate-900 mt-0.5 truncate" id="stat-cash">0đ</div>
        </div>

        <!-- Chuyển khoản -->
        <div class="bg-white p-2 rounded-lg border border-slate-200 text-center">
          <div class="text-[10px] font-medium text-slate-500">💳 CK (<span id="count-transfer">0</span>)</div>
          <div class="text-xs sm:text-sm font-bold text-slate-900 mt-0.5 truncate" id="stat-transfer">0đ</div>
        </div>

        <!-- Tổng đã thu -->
        <div class="bg-slate-50 p-2 rounded-lg border border-slate-300 text-center">
          <div class="text-[10px] font-semibold text-slate-700">💰 Tổng đã thu</div>
          <div class="text-xs sm:text-sm font-extrabold text-emerald-600 mt-0.5 truncate" id="stat-total">0đ</div>
        </div>
      </div>

      <!-- Search Input -->
      <div class="relative flex items-center mb-1.5">
        <span class="absolute left-2.5 text-slate-400 text-xs">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Tìm theo tên, MSSV, mã lớp..." 
          oninput="handleSearch(this.value)"
          class="w-full pl-8 pr-7 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:bg-white focus:outline-none focus:border-slate-800 focus:ring-0 placeholder:text-slate-400"
        />
        <button 
          id="clear-search-btn" 
          onclick="clearSearch()" 
          class="hidden absolute right-2 text-slate-400 hover:text-slate-600 p-0.5 text-xs font-bold"
        >
          ✕
        </button>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-1 overflow-x-auto custom-scroll text-[11px]">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-2.5 py-0.5 rounded-full font-semibold transition-all bg-slate-900 text-white shrink-0">
          Tất cả (<span id="count-all">0</span>)
        </button>
        <button onclick="setFilter('unpaid')" id="filter-unpaid" class="filter-btn px-2.5 py-0.5 rounded-full font-medium transition-all bg-white border border-slate-200 text-slate-600 shrink-0">
          Chưa thu (<span id="count-unpaid">0</span>)
        </button>
        <button onclick="setFilter('cash')" id="filter-cash" class="filter-btn px-2.5 py-0.5 rounded-full font-medium transition-all bg-white border border-slate-200 text-slate-600 shrink-0">
          Tiền mặt
        </button>
        <button onclick="setFilter('transfer')" id="filter-transfer" class="filter-btn px-2.5 py-0.5 rounded-full font-medium transition-all bg-white border border-slate-200 text-slate-600 shrink-0">
          Chuyển khoản
        </button>
      </div>

    </div>
  </header>

  <!-- ================= MAIN STUDENT LIST ================= -->
  <main class="flex-1 max-w-xl w-full mx-auto px-3 py-2">
    <!-- List -->
    <div id="student-list" class="space-y-1.5 pb-20">
      <!-- Items generated here -->
    </div>

    <!-- Search Not Found State -->
    <div id="not-found-state" class="hidden text-center py-8 text-slate-400 text-xs">
      Không tìm thấy sinh viên phù hợp.
    </div>
  </main>

  <!-- ================= MODAL: CÀI ĐẶT GIÁ TIỀN ================= -->
  <div id="price-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-xs rounded-xl p-4 shadow-lg border border-slate-200">
      <h3 class="text-xs font-bold text-slate-900 mb-1">🏷️ Cài đặt giá tiền mỗi cuốn</h3>
      <p class="text-[11px] text-slate-500 mb-3">Nhập giá 1 cuốn để tự động tính tổng tiền:</p>
      
      <div class="relative mb-3">
        <input 
          type="text" 
          inputmode="numeric"
          id="price-input" 
          oninput="formatPriceInput(this)"
          placeholder="Ví dụ: 150.000" 
          class="w-full px-2.5 py-2 border border-slate-300 rounded-lg text-sm font-bold text-slate-900 focus:outline-none focus:border-slate-800"
        />
        <span class="absolute right-2.5 top-2.5 text-[11px] text-slate-400 font-semibold">VNĐ</span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="closePriceModal()" class="flex-1 py-1.5 rounded-lg border border-slate-200 text-slate-600 text-xs font-medium">
          Hủy
        </button>
        <button onclick="savePriceSetting()" class="flex-1 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-semibold">
          Lưu lại
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL: TÙY CHỌN & SAO LƯU ================= -->
  <div id="import-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-xl p-4 shadow-lg border border-slate-200 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-1.5">
        <h3 class="text-xs font-bold text-slate-900">⚙️ Cài Đặt & Quản Lý</h3>
        <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-700 text-sm font-bold p-1">✕</button>
      </div>

      <div class="space-y-3">
        <!-- 1. Reset to original 67 students -->
        <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200">
          <label class="block text-xs font-bold text-slate-800 mb-1">🔄 Danh sách gốc PDF</label>
          <p class="text-[11px] text-slate-500 mb-2">Đã tích hợp sẵn 67 sinh viên từ file PDF của cô.</p>
          <button onclick="resetToOriginalPDF()" class="w-full py-1.5 bg-slate-900 hover:bg-black text-white rounded text-xs font-semibold">
            Nạp lại 67 sinh viên gốc
          </button>
        </div>

        <!-- 2. Backup / Restore -->
        <div class="pt-2 border-t border-slate-100 flex flex-col gap-1.5">
          <div class="flex items-center gap-1.5">
            <button onclick="backupJSON()" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium">
              💾 Sao lưu (JSON)
            </button>
            <label class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium text-center cursor-pointer">
              📥 Khôi phục
              <input type="file" accept=".json" onchange="restoreJSON(this)" class="hidden" />
            </label>
          </div>
          <button onclick="clearAllPaymentMarks()" class="w-full py-1 text-amber-700 hover:bg-amber-50 rounded text-xs font-medium border border-amber-200">
            🧹 Xóa toàn bộ tick & tiền đã thu (giữ nguyên tên)
          </button>
        </div>
      </div>
    </div>
  </div>

    const STORAGE_KEY = 'book_sales_data_67_v1';
    const SETTINGS_KEY = 'book_sales_settings_67_v1';

    let students = [];
    let settings = {
      pricePerBook: 0
    };
    let currentFilter = 'all';
    let searchQuery = '';

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      loadDataFromStorage();
      renderApp();
    });

    function loadDataFromStorage() {
      try {
        const savedStudents = localStorage.getItem(STORAGE_KEY);
        const savedSettings = localStorage.getItem(SETTINGS_KEY);
        if (savedStudents) {
          students = JSON.parse(savedStudents);
        } else {
          // Default to the 67 extracted students
          students = JSON.parse(JSON.stringify(ORIGINAL_STUDENTS));
          saveToStorage();
        }
        if (savedSettings) {
          settings = JSON.parse(savedSettings);
        }
      } catch (err) {
        console.error('Lỗi đọc localStorage:', err);
        students = JSON.parse(JSON.stringify(ORIGINAL_STUDENTS));
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        
        const tag = document.getElementById('save-tag');
        if (tag) {
          tag.innerText = '✓ Đã lưu';
          tag.className = 'text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-medium border border-emerald-200';
        }
      } catch (err) {
        console.error('Lỗi ghi localStorage:', err);
      }
    }

    function formatNumberWithDots(val) {
      if (!val && val !== 0) return '';
      const numStr = String(val).replace(/\D/g, '');
      if (!numStr) return '';
      return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatCurrency(amount) {
      if (!amount || isNaN(amount)) return '0đ';
      return formatNumberWithDots(amount) + 'đ';
    }

    function getNowFormatted() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(now.getHours())}:${pad(now.getMinutes())} ${pad(now.getDate())}/${pad(now.getMonth() + 1)}`;
    }

    function updateStats() {
      const total = students.length;
      const cashCount = students.filter(s => s.paymentMethod === 'cash').length;
      const transferCount = students.filter(s => s.paymentMethod === 'transfer').length;
      const unpaidCount = students.filter(s => !s.paymentMethod).length;

      const price = settings.pricePerBook || 0;
      const cashTotal = cashCount * price;
      const transferTotal = transferCount * price;
      const grandTotal = cashTotal + transferTotal;

      document.getElementById('stat-cash').innerText = formatCurrency(cashTotal);
      document.getElementById('stat-transfer').innerText = formatCurrency(transferTotal);
      document.getElementById('stat-total').innerText = formatCurrency(grandTotal);

      document.getElementById('count-cash').innerText = cashCount;
      document.getElementById('count-transfer').innerText = transferCount;
      document.getElementById('count-all').innerText = total;
      document.getElementById('count-unpaid').innerText = unpaidCount;

      document.getElementById('price-display').innerText = settings.pricePerBook ? formatCurrency(settings.pricePerBook) : 'Đặt giá';
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.className = 'filter-btn px-2.5 py-0.5 rounded-full font-medium transition-all bg-white border border-slate-200 text-slate-600 shrink-0';
      });

      const activeBtn = document.getElementById(`filter-${filterType}`);
      if (activeBtn) {
        activeBtn.className = 'filter-btn px-2.5 py-0.5 rounded-full font-semibold transition-all bg-slate-900 text-white shrink-0';
      }

      renderList();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clear-search-btn');
      if (searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderList();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      handleSearch('');
    }

    function renderList() {
      const container = document.getElementById('student-list');
      const notFoundState = document.getElementById('not-found-state');

      const filtered = students.filter(student => {
        if (currentFilter === 'unpaid' && student.paymentMethod) return false;
        if (currentFilter === 'cash' && student.paymentMethod !== 'cash') return false;
        if (currentFilter === 'transfer' && student.paymentMethod !== 'transfer') return false;

        if (searchQuery) {
          const matchName = (student.fullName || '').toLowerCase().includes(searchQuery);
          const matchCode = (student.studentCode || '').toLowerCase().includes(searchQuery);
          const matchClass = (student.classCode || '').toLowerCase().includes(searchQuery);
          const matchSTT = String(student.stt || '').includes(searchQuery);
          if (!matchName && !matchCode && !matchClass && !matchSTT) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        notFoundState.classList.remove('hidden');
        updateStats();
        return;
      }

      notFoundState.classList.add('hidden');

      let html = '';
      filtered.forEach((student) => {
        const isPaidCash = student.paymentMethod === 'cash';
        const isPaidTransfer = student.paymentMethod === 'transfer';
        const isPaid = isPaidCash || isPaidTransfer;
        const isTicked = student.isTicked || isPaid;

        let cardBg = 'bg-white border-slate-200';
        if (isPaidCash) cardBg = 'bg-slate-50 border-slate-400';
        else if (isPaidTransfer) cardBg = 'bg-slate-50 border-slate-400';

        html += `
          <div class="p-2 rounded-lg border ${cardBg} transition-all flex flex-col gap-1.5">
            <!-- Top line: Checkbox + Name + MSSV + Class -->
            <div class="flex items-center justify-between gap-1.5">
              <div class="flex items-center gap-2 flex-1 min-w-0">
                <!-- Checkbox -->
                <button 
                  onclick="toggleTicked('${student.id}')"
                  class="touch-btn w-5 h-5 rounded border flex items-center justify-center shrink-0 ${
                    isTicked ? 'bg-slate-900 border-slate-900 text-white' : 'bg-white border-slate-300 text-transparent'
                  }"
                >
                  <svg class="w-3 h-3 fill-current" viewBox="0 0 20 20">
                    <path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/>
                  </svg>
                </button>

                <!-- Student details -->
                <div class="min-w-0 flex-1 flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] font-bold text-slate-400 w-4">${student.stt || '-'}</span>
                  <span class="text-xs font-bold text-slate-900 truncate">${escapeHtml(student.fullName || 'Không rõ tên')}</span>
                  <span class="text-[10px] font-mono text-slate-500 bg-slate-100 px-1 rounded">${escapeHtml(student.studentCode || '')}</span>
                  <span class="text-[10px] text-slate-500">${escapeHtml(student.classCode || '')}</span>
                </div>
              </div>

              ${student.paymentTime ? `<span class="text-[9px] text-slate-400 font-medium shrink-0">${student.paymentTime}</span>` : ''}
            </div>

            <!-- Bottom line: 2 Quick Payment Click Buttons -->
            <div class="grid grid-cols-2 gap-1 pl-7">
              <!-- Tiền mặt -->
              <button 
                onclick="setPaymentMethod('${student.id}', 'cash')"
                class="touch-btn py-1 px-1.5 rounded text-[11px] font-semibold transition-all flex items-center justify-center gap-1 border ${
                  isPaidCash 
                    ? 'bg-slate-900 text-white border-slate-900' 
                    : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 active:bg-slate-100'
                }"
              >
                <span>💵 Tiền mặt</span>
                ${isPaidCash ? '<span>✓</span>' : ''}
              </button>

              <!-- Chuyển khoản -->
              <button 
                onclick="setPaymentMethod('${student.id}', 'transfer')"
                class="touch-btn py-1 px-1.5 rounded text-[11px] font-semibold transition-all flex items-center justify-center gap-1 border ${
                  isPaidTransfer 
                    ? 'bg-slate-900 text-white border-slate-900' 
                    : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 active:bg-slate-100'
                }"
              >
                <span>💳 Chuyển khoản</span>
                ${isPaidTransfer ? '<span>✓</span>' : ''}
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      updateStats();
    }

    function toggleTicked(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;
      student.isTicked = !student.isTicked;
      saveToStorage();
      renderList();
    }

    function setPaymentMethod(id, method) {
      const student = students.find(s => s.id === id);
      if (!student) return;

      if (student.paymentMethod === method) {
        student.paymentMethod = null;
        student.paymentTime = null;
      } else {
        student.paymentMethod = method;
        student.isTicked = true;
        student.paymentTime = getNowFormatted();
      }

      saveToStorage();
      renderList();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderApp() {
      renderList();
      updateStats();
    }

    // Modal Price
    function formatPriceInput(input) {
      const raw = input.value.replace(/\D/g, '');
      if (!raw) {
        input.value = '';
        return;
      }
      input.value = formatNumberWithDots(raw);
    }

    function openPriceModal() {
      const price = settings.pricePerBook;
      document.getElementById('price-input').value = price ? formatNumberWithDots(price) : '';
      document.getElementById('price-modal').classList.remove('hidden');
      setTimeout(() => {
        const inp = document.getElementById('price-input');
        inp.focus();
        inp.select();
      }, 50);
    }

    function closePriceModal() {
      document.getElementById('price-modal').classList.add('hidden');
    }

    function savePriceSetting() {
      const input = document.getElementById('price-input').value;
      const cleanNum = input.replace(/\D/g, '');
      const val = parseInt(cleanNum, 10);
      settings.pricePerBook = isNaN(val) ? 0 : val;
      saveToStorage();
      closePriceModal();
      updateStats();
    }

    // Modal Settings
    function openImportModal() {
      document.getElementById('import-modal').classList.remove('hidden');
    }

    function closeImportModal() {
      document.getElementById('import-modal').classList.add('hidden');
    }

    function resetToOriginalPDF() {
      if (confirm('Bạn có muốn nạp lại danh sách 67 sinh viên gốc từ file PDF không? (Dữ liệu tick trước đó sẽ được làm mới)')) {
        students = JSON.parse(JSON.stringify(ORIGINAL_STUDENTS));
        saveToStorage();
        renderApp();
        closeImportModal();
        alert('Đã nạp thành công 67 sinh viên!');
      }
    }

    function clearAllPaymentMarks() {
      if (confirm('Bạn có chắc muốn xóa toàn bộ đánh dấu tick và tiền đã thu không?')) {
        students.forEach(s => {
          s.paymentMethod = null;
          s.isTicked = false;
          s.paymentTime = null;
        });
        saveToStorage();
        renderApp();
        closeImportModal();
      }
    }

    // Excel Export
    function exportToExcel() {
      if (!students || students.length === 0) {
        alert('Danh sách đang trống!');
        return;
      }

      const price = settings.pricePerBook || 0;

      const dataRows = students.map((s, idx) => {
        let hinhThuc = 'Chưa thu';
        let soTien = 0;
        if (s.paymentMethod === 'cash') {
          hinhThuc = 'Tiền mặt';
          soTien = price;
        } else if (s.paymentMethod === 'transfer') {
          hinhThuc = 'Chuyển khoản';
          soTien = price;
        }

        return {
          'STT': s.stt || (idx + 1),
          'Mã Sinh Viên': s.studentCode || '',
          'Họ và Tên': s.fullName || '',
          'Mã Lớp': s.classCode || '',
          'Trạng Thái Tick': (s.isTicked || s.paymentMethod) ? 'Đã nhận' : 'Chưa',
          'Hình Thức Thanh Toán': hinhThuc,
          'Số Tiền (VNĐ)': soTien,
          'Thời Gian Ghi Nhận': s.paymentTime || ''
        };
      });

      const cashCount = students.filter(s => s.paymentMethod === 'cash').length;
      const transferCount = students.filter(s => s.paymentMethod === 'transfer').length;

      dataRows.push({});
      dataRows.push({
        'STT': 'TỔNG KẾT',
        'Mã Sinh Viên': '',
        'Họ và Tên': `Tổng: ${students.length} sinh viên`,
        'Mã Lớp': '',
        'Trạng Thái Tick': `Tiền mặt: ${cashCount} | CK: ${transferCount}`,
        'Hình Thức Thanh Toán': `Tổng tiền: ${(cashCount + transferCount) * price} VNĐ`,
        'Số Tiền (VNĐ)': (cashCount + transferCount) * price,
        'Thời Gian Ghi Nhận': `Xuất lúc: ${getNowFormatted()}`
      });

      const worksheet = XLSX.utils.json_to_sheet(dataRows);
      worksheet['!cols'] = [
        { wch: 6 },
        { wch: 15 },
        { wch: 25 },
        { wch: 14 },
        { wch: 16 },
        { wch: 20 },
        { wch: 16 },
        { wch: 20 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Ban_Sach');

      const now = new Date();
      const filename = `Danh_Sach_Ban_Sach_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`;
      XLSX.writeFile(workbook, filename);
    }

    function backupJSON() {
      const data = { students, settings, backupTime: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_Ban_Sach_${Date.now()}.json`;
      a.click();
    }

    function restoreJSON(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.students && Array.isArray(data.students)) {
            students = data.students;
            if (data.settings) settings = data.settings;
            saveToStorage();
            renderApp();
            closeImportModal();
            alert('Khôi phục dữ liệu thành công!');
          }
        } catch (err) {
          alert('Lỗi: ' + err.message);
        }
      };
      reader.readAsText(file);
    }
  </script>
